<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#06b6d4;#3b82f6;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#06b6d4;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#6366f1;#a855f7" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="0" cy="0" r="1.5" fill="#334155" opacity="0.8" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes scanline {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(330px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(99,102,241,0.6)); }
        50% { filter: drop-shadow(0 0 25px rgba(6,182,212,0.9)); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .scanner-beam {
        animation: scanline 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .logo-group {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .animated-dash {
        stroke-dasharray: 4, 4;
        animation: dashAnim 2s linear infinite;
      }
      .node-float-1 { animation: floatNode 3s ease-in-out infinite; }
      .node-float-2 { animation: floatNode 3.5s ease-in-out infinite 0.5s; }
      .node-float-3 { animation: floatNode 4s ease-in-out infinite 1s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="280" fill="url(#grid)" rx="16" />

  <!-- Animated Scanner Beam -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#lineGrad)" stroke-width="2" class="scanner-beam" />

  <!-- Background Geometric Circuit Nodes -->
  <g opacity="0.35">
    <path d="M 80,140 L 160,80 L 220,80 L 260,120" fill="none" stroke="#475569" stroke-width="1.5" />
    <path d="M 160,80 L 160,200 L 240,240" fill="none" stroke="#475569" stroke-width="1.5" />
    <path d="M 780,60 L 840,110 L 920,110" fill="none" stroke="#475569" stroke-width="1.5" />
    <path d="M 840,110 L 840,220 L 760,250" fill="none" stroke="#475569" stroke-width="1.5" />
    
    <circle cx="80" cy="140" r="4" fill="#6366f1" class="node-float-1" />
    <circle cx="260" cy="120" r="3" fill="#06b6d4" class="node-float-2" />
    <circle cx="780" cy="60" r="3.5" fill="#a855f7" class="node-float-3" />
    <circle cx="920" cy="110" r="4" fill="#38bdf8" class="node-float-1" />
  </g>

  <!-- Left: StateWeaver Interactive Mesh Icon -->
  <g class="logo-group" transform="translate(110, 140)">
    <!-- Outer Hexagon -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="none" stroke="url(#neonGrad)" stroke-width="3" />
    <!-- Inner Hexagon -->
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="rgba(99, 102, 241, 0.08)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Center Web Star -->
    <circle cx="0" cy="0" r="6" fill="#f8fafc" />
    <line x1="0" y1="0" x2="0" y2="-65" stroke="url(#neonGrad)" stroke-width="2" class="animated-dash" />
    <line x1="0" y1="0" x2="56" y2="-32" stroke="url(#neonGrad)" stroke-width="2" class="animated-dash" />
    <line x1="0" y1="0" x2="56" y2="32" stroke="url(#neonGrad)" stroke-width="2" class="animated-dash" />
    <line x1="0" y1="0" x2="0" y2="65" stroke="url(#neonGrad)" stroke-width="2" class="animated-dash" />
    <line x1="0" y1="0" x2="-56" y2="32" stroke="url(#neonGrad)" stroke-width="2" class="animated-dash" />
    <line x1="0" y1="0" x2="-56" y2="-32" stroke="url(#neonGrad)" stroke-width="2" class="animated-dash" />

    <!-- Corner Nodes -->
    <circle cx="0" cy="-65" r="4.5" fill="#6366f1" />
    <circle cx="56" cy="-32" r="4.5" fill="#06b6d4" />
    <circle cx="56" cy="32" r="4.5" fill="#38bdf8" />
    <circle cx="0" cy="65" r="4.5" fill="#a855f7" />
    <circle cx="-56" cy="32" r="4.5" fill="#ec4899" />
    <circle cx="-56" cy="-32" r="4.5" fill="#6366f1" />
  </g>

  <!-- Center Text Content -->
  <g transform="translate(230, 0)">
    <!-- Subtitle Pill -->
    <rect x="0" y="55" width="375" height="26" rx="13" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="68" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">STATEFUL API SECURITY RESEARCH ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="46" font-weight="900" fill="url(#neonGrad)" letter-spacing="2">STATEWEAVER</text>

    <!-- Tagline -->
    <text x="2" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#f1f5f9" opacity="0.95">
      "Find the security bugs that scanners can't understand."
    </text>

    <!-- Capability Badges -->
    <g transform="translate(0, 202)">
      <!-- Badge 1: BOLA / IDOR -->
      <rect x="0" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">BOLA / IDOR</text>

      <!-- Badge 2: Cross-Tenant -->
      <rect x="115" y="0" width="155" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="125" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#ec4899">CROSS-TENANT LEAKS</text>

      <!-- Badge 3: RBAC Flaws -->
      <rect x="280" y="0" width="145" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="290" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#eab308">PRIVILEGE ESCALATION</text>

      <!-- Badge 4: Revocation -->
      <rect x="435" y="0" width="160" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="445" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#a855f7">REVOKED CREDENTIALS</text>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="1" y="1" width="998" height="278" rx="15" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.4" />
</svg>

