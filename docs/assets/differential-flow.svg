<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <style>
      @keyframes travelPacket {
        0% { stroke-dashoffset: 80; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .packet-line {
        stroke-dasharray: 20, 60;
        animation: travelPacket 2.5s linear infinite;
      }
      .node-text { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f8fafc; }
      .sub-text { font-family: -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="920" height="340" rx="12" fill="url(#flowBg)" stroke="#334155" stroke-width="1.2" />

  <!-- Section Titles -->
  <text x="70" y="35" class="sub-text" font-weight="700" fill="#64748b" letter-spacing="1">1. IDENTITIES (ACTORS)</text>
  <text x="360" y="35" class="sub-text" font-weight="700" fill="#64748b" letter-spacing="1">2. TARGET API &amp; NORMALIZER</text>
  <text x="690" y="35" class="sub-text" font-weight="700" fill="#64748b" letter-spacing="1">3. DIFFERENTIAL ENGINE</text>

  <!-- Identity Nodes (Left Column) -->
  <!-- Alice -->
  <g transform="translate(40, 55)">
    <rect width="180" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="25" r="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" />
    <text x="38" y="22" class="node-text">Alice (Owner)</text>
    <text x="38" y="38" class="sub-text">Tenant: Org-A [Baseline]</text>
  </g>

  <!-- Bob -->
  <g transform="translate(40, 120)">
    <rect width="180" height="50" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
    <circle cx="20" cy="25" r="8" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308" />
    <text x="38" y="22" class="node-text">Bob (Viewer)</text>
    <text x="38" y="38" class="sub-text">Tenant: Org-A [RBAC Probe]</text>
  </g>

  <!-- Charlie -->
  <g transform="translate(40, 185)">
    <rect width="180" height="50" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="20" cy="25" r="8" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" />
    <text x="38" y="22" class="node-text">Charlie (Member)</text>
    <text x="38" y="38" class="sub-text">Tenant: Org-B [Cross-Tenant]</text>
  </g>

  <!-- Dave -->
  <g transform="translate(40, 250)">
    <rect width="180" height="50" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="20" cy="25" r="8" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" />
    <text x="38" y="22" class="node-text">Dave (Revoked)</text>
    <text x="38" y="38" class="sub-text">Tenant: Org-A [Revoked Token]</text>
  </g>

  <!-- Connecting Lines from Actors to Gateway -->
  <path d="M 220,80 L 340,165" stroke="#334155" stroke-width="1.5" />
  <path d="M 220,80 L 340,165" stroke="#10b981" stroke-width="2.5" class="packet-line" />

  <path d="M 220,145 L 340,165" stroke="#334155" stroke-width="1.5" />
  <path d="M 220,145 L 340,165" stroke="#eab308" stroke-width="2.5" class="packet-line" style="animation-delay: 0.6s;" />

  <path d="M 220,210 L 340,165" stroke="#334155" stroke-width="1.5" />
  <path d="M 220,210 L 340,165" stroke="#ec4899" stroke-width="2.5" class="packet-line" style="animation-delay: 1.2s;" />

  <path d="M 220,275 L 340,165" stroke="#334155" stroke-width="1.5" />
  <path d="M 220,275 L 340,165" stroke="#a855f7" stroke-width="2.5" class="packet-line" style="animation-delay: 1.8s;" />

  <!-- Target API Center Hub -->
  <g transform="translate(340, 105)">
    <rect width="210" height="120" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="25" y="35" class="node-text" font-size="14" fill="#38bdf8">API Gateway &amp; Lab</text>
    <text x="25" y="60" class="sub-text">/api/projects/{project_id}</text>
    <text x="25" y="80" class="sub-text">/api/projects/{id}/secrets</text>
    <text x="25" y="100" class="sub-text" fill="#10b981">Noise Reducer &amp; Scrubber</text>
  </g>

  <!-- Connecting Lines from Gateway to Differential Engine -->
  <path d="M 550,165 L 670,165" stroke="#334155" stroke-width="2" />
  <path d="M 550,165 L 670,165" stroke="#6366f1" stroke-width="3" class="packet-line" style="animation-delay: 0.8s;" />

  <!-- Differential Engine Node (Right Column) -->
  <g transform="translate(670, 75)">
    <rect width="210" height="180" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <text x="20" y="32" class="node-text" font-size="14" fill="#a5b4fc">Differential Engine</text>
    <line x1="20" y1="42" x2="190" y2="42" stroke="#334155" stroke-width="1" />
    
    <text x="20" y="65" class="sub-text" font-weight="700" fill="#f8fafc">Policy Rules Evaluator</text>
    <text x="20" y="85" class="sub-text">✓ Cross-Tenant Isolation</text>
    <text x="20" y="105" class="sub-text">✓ Privilege Restrictions</text>
    <text x="20" y="125" class="sub-text">✓ Stale Revocation Check</text>
    
    <!-- Finding Output Pill -->
    <rect x="20" y="140" width="170" height="26" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1" />
    <text x="32" y="157" class="sub-text" font-weight="700" fill="#ef4444">10 BOLA / Flaws Detected</text>
  </g>
</svg>

