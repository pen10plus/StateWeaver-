<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Typing reveal clip path for command line -->
    <clipPath id="cmdClip">
      <rect x="230" y="-15" width="0" height="30">
        <animate attributeName="width" values="0;580;580;0" keyTimes="0;0.16;0.94;1" dur="12s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Scan progress bar clip path -->
    <clipPath id="progressClip">
      <rect x="0" y="0" width="0" height="4">
        <animate attributeName="width" values="0;0;790;790;0" keyTimes="0;0.18;0.68;0.94;1" dur="12s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="15" y="15" width="870" height="470" rx="10" fill="url(#termBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M 15 25 Q 15 15 25 15 L 875 15 Q 885 15 885 25 L 885 52 L 15 52 Z" fill="#1e293b" />
  <circle cx="40" cy="34" r="6" fill="#ef4444" />
  <circle cx="60" cy="34" r="6" fill="#f59e0b" />
  <circle cx="80" cy="34" r="6" fill="#10b981" />
  <text x="450" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">stateweaver — test execution</text>

  <!-- Animated Progress Line across header -->
  <rect x="15" y="52" width="870" height="2" fill="#1e293b" />
  <rect x="15" y="52" width="870" height="2" fill="#06b6d4" clip-path="url(#progressClip)" />

  <!-- Terminal Content Area -->
  <g transform="translate(45, 85)" font-family="Consolas, 'Courier New', Menlo, Monaco, monospace" font-size="12.5">
    
    <!-- Prompt & Typed Command -->
    <text x="0" y="0">
      <tspan fill="#10b981" font-weight="bold">researcher@stateweaver</tspan>
      <tspan fill="#64748b">:</tspan>
      <tspan fill="#38bdf8">~/project</tspan>
      <tspan fill="#f8fafc">$ </tspan>
    </text>

    <!-- Typing Command (revealed via animated clipPath) -->
    <g clip-path="url(#cmdClip)">
      <text x="235" y="0" fill="#f1f5f9">stateweaver test --target http://127.0.0.1:8080 --read-only=false</text>
    </g>

    <!-- Blinking / Moving Cursor -->
    <rect x="235" y="-12" width="8" height="15" fill="#38bdf8">
      <animate attributeName="x" values="235;815;815;235" keyTimes="0;0.16;0.94;1" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
    </rect>

    <!-- Step 1: Scan Initialization Header -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.22;0.94;1" dur="12s" repeatCount="indefinite" fill="freeze" />
      <text x="0" y="28" fill="#6366f1">=================================================================================</text>
      <text x="0" y="46" fill="#a5b4fc" font-weight="bold">  STATEWEAVER DIFFERENTIAL AUTHORIZATION SUITE v1.0.0</text>
      <text x="0" y="64" fill="#64748b">  Baseline Endpoints: 4  │  Identities: 5 (Org-A, Org-B)  │  Test Hypotheses: 16</text>
      <text x="0" y="82" fill="#6366f1">---------------------------------------------------------------------------------</text>
    </g>

    <!-- Step 2: Finding 1 - Cross-Tenant BOLA -->
    <g opacity="0" transform="translate(0, 105)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.30;0.94;1" dur="12s" repeatCount="indefinite" fill="freeze" />
      <text x="0" y="0">
        <tspan fill="#ef4444" font-weight="bold">[!] [CRITICAL]</tspan>
        <tspan fill="#f8fafc"> Cross-Tenant Access Weakness </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> GET /api/projects/1001</tspan>
      </text>
      <text x="20" y="18" fill="#94a3b8">
        Actor: <tspan fill="#ec4899">Charlie (Member, Org-B)</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="bold">HTTP 200 OK</tspan> (Expected: 403/404)
      </text>
    </g>

    <!-- Step 3: Finding 2 - Role-Based Privilege Escalation -->
    <g opacity="0" transform="translate(0, 150)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.40;0.94;1" dur="12s" repeatCount="indefinite" fill="freeze" />
      <text x="0" y="0">
        <tspan fill="#f97316" font-weight="bold">[!] [HIGH]    </tspan>
        <tspan fill="#f8fafc"> Role-Based Privilege Escalation </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> DELETE /api/projects/1001</tspan>
      </text>
      <text x="20" y="18" fill="#94a3b8">
        Actor: <tspan fill="#eab308">Bob (Viewer, Org-A)</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="bold">HTTP 204 No Content</tspan> (Expected: 403)
      </text>
    </g>

    <!-- Step 4: Finding 3 - Revoked Credential Retention -->
    <g opacity="0" transform="translate(0, 195)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.50;0.94;1" dur="12s" repeatCount="indefinite" fill="freeze" />
      <text x="0" y="0">
        <tspan fill="#ef4444" font-weight="bold">[!] [CRITICAL]</tspan>
        <tspan fill="#f8fafc"> Revoked-Access Inconsistency </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> GET /api/projects/1001/secrets</tspan>
      </text>
      <text x="20" y="18" fill="#94a3b8">
        Actor: <tspan fill="#a855f7">Dave (Revoked Member)</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="bold">HTTP 200 OK (Secret Exposed)</tspan>
      </text>
    </g>

    <!-- Step 5: Finding 4 - Broken Authentication -->
    <g opacity="0" transform="translate(0, 240)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.60;0.94;1" dur="12s" repeatCount="indefinite" fill="freeze" />
      <text x="0" y="0">
        <tspan fill="#eab308" font-weight="bold">[!] [HIGH]    </tspan>
        <tspan fill="#f8fafc"> Broken Authentication </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> GET /api/projects</tspan>
      </text>
      <text x="20" y="18" fill="#94a3b8">
        Actor: <tspan fill="#64748b">Anonymous User</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="bold">HTTP 200 OK</tspan> (Expected: 401)
      </text>
    </g>

    <!-- Step 6: Summary Banner & Complete Status -->
    <g opacity="0" transform="translate(0, 285)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.72;0.94;1" dur="12s" repeatCount="indefinite" fill="freeze" />
      <text x="0" y="0" fill="#6366f1">=================================================================================</text>
      <text x="0" y="18">
        <tspan fill="#10b981" font-weight="bold">[✓] Probes: 16/16 </tspan>
        <tspan fill="#64748b">│</tspan>
        <tspan fill="#ef4444" font-weight="bold"> Findings Discovered: 10 </tspan>
        <tspan fill="#64748b">│</tspan>
        <tspan fill="#38bdf8" font-weight="bold"> Precision: 100% </tspan>
        <tspan fill="#64748b">│</tspan>
        <tspan fill="#a855f7" font-weight="bold"> Recall: 100%</tspan>
      </text>
      <text x="0" y="38" fill="#94a3b8">
        Reports Generated: <tspan fill="#f8fafc">reports/report.html</tspan>, <tspan fill="#f8fafc">reports/report.json</tspan>, <tspan fill="#f8fafc">reports/report.md</tspan>
      </text>
      <text x="0" y="60">
        <tspan fill="#10b981" font-weight="bold">researcher@stateweaver</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/project</tspan><tspan fill="#f8fafc">$ </tspan>
        <tspan fill="#38bdf8">echo "Scan complete!"</tspan>
      </text>
    </g>

  </g>
</svg>
