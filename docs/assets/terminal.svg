<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes typeCmd {
        0% { width: 0; }
        20%, 100% { width: 590px; }
      }
      @keyframes showHeader {
        0%, 18% { opacity: 0; transform: translateY(4px); }
        24%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes showFind1 {
        0%, 28% { opacity: 0; transform: translateY(4px); }
        34%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes showFind2 {
        0%, 38% { opacity: 0; transform: translateY(4px); }
        44%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes showFind3 {
        0%, 48% { opacity: 0; transform: translateY(4px); }
        54%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes showFind4 {
        0%, 58% { opacity: 0; transform: translateY(4px); }
        64%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes showSummary {
        0%, 68% { opacity: 0; transform: translateY(4px); }
        76%, 100% { opacity: 1; transform: translateY(0); }
      }

      .term-font { font-family: 'Fira Code', 'JetBrains Mono', Menlo, Monaco, Consolas, 'Courier New', monospace; font-size: 13px; }
      .cursor { animation: blink 0.8s infinite; }
      .anim-cmd { overflow: hidden; white-space: nowrap; display: inline-block; animation: typeCmd 12s steps(45, end) infinite; }
      .anim-header { animation: showHeader 12s ease-out infinite; }
      .anim-find1 { animation: showFind1 12s ease-out infinite; }
      .anim-find2 { animation: showFind2 12s ease-out infinite; }
      .anim-find3 { animation: showFind3 12s ease-out infinite; }
      .anim-find4 { animation: showFind4 12s ease-out infinite; }
      .anim-summary { animation: showSummary 12s ease-out infinite; }
    </style>
  </defs>

  <!-- Window Container with Shadow -->
  <rect x="20" y="20" width="860" height="480" rx="10" fill="url(#termBg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Header Bar -->
  <path d="M 20 30 Q 20 20 30 20 L 870 20 Q 880 20 880 30 L 880 58 L 20 58 Z" fill="#1e293b" />
  <circle cx="44" cy="39" r="6" fill="#ef4444" />
  <circle cx="64" cy="39" r="6" fill="#f59e0b" />
  <circle cx="84" cy="39" r="6" fill="#10b981" />
  <text x="450" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">stateweaver — test execution</text>

  <!-- Terminal Content -->
  <g transform="translate(45, 90)" class="term-font">
    <!-- Prompt Line -->
    <text x="0" y="0">
      <tspan fill="#10b981" font-weight="700">researcher@stateweaver</tspan>
      <tspan fill="#64748b">:</tspan>
      <tspan fill="#38bdf8">~/project</tspan>
      <tspan fill="#f8fafc">$ </tspan>
      <tspan fill="#f1f5f9">stateweaver test --target http://127.0.0.1:8080 --read-only=false</tspan>
    </text>

    <!-- Header Box -->
    <g transform="translate(0, 30)" class="anim-header">
      <text x="0" y="0" fill="#6366f1">========================================================================</text>
      <text x="0" y="20" fill="#a5b4fc" font-weight="700">  STATEWEAVER DIFFERENTIAL AUTHORIZATION SUITE v1.0.0</text>
      <text x="0" y="40" fill="#64748b">  Baseline Endpoints: 4  │  Identities: 5 (Org-A, Org-B)  │  Hypotheses: 16</text>
      <text x="0" y="60" fill="#6366f1">------------------------------------------------------------------------</text>
    </g>

    <!-- Finding 1: Cross-Tenant BOLA -->
    <g transform="translate(0, 115)" class="anim-find1">
      <text x="0" y="0">
        <tspan fill="#ef4444" font-weight="700">[!] [CRITICAL]</tspan>
        <tspan fill="#f8fafc" font-weight="600"> Cross-Tenant Access Weakness </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> GET /api/projects/1001</tspan>
      </text>
      <text x="20" y="20" fill="#94a3b8">
        Actor: <tspan fill="#ec4899">Charlie (Member, Org-B)</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="700">HTTP 200 OK</tspan> (Expected: 403/404)
      </text>
    </g>

    <!-- Finding 2: Privilege Escalation -->
    <g transform="translate(0, 165)" class="anim-find2">
      <text x="0" y="0">
        <tspan fill="#f97316" font-weight="700">[!] [HIGH]    </tspan>
        <tspan fill="#f8fafc" font-weight="600"> Role-Based Privilege Escalation </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> DELETE /api/projects/1001</tspan>
      </text>
      <text x="20" y="20" fill="#94a3b8">
        Actor: <tspan fill="#eab308">Bob (Viewer, Org-A)</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="700">HTTP 204 No Content</tspan> (Expected: 403)
      </text>
    </g>

    <!-- Finding 3: Revocation Bypass -->
    <g transform="translate(0, 215)" class="anim-find3">
      <text x="0" y="0">
        <tspan fill="#ef4444" font-weight="700">[!] [CRITICAL]</tspan>
        <tspan fill="#f8fafc" font-weight="600"> Revoked-Access Inconsistency </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> GET /api/projects/1001/secrets</tspan>
      </text>
      <text x="20" y="20" fill="#94a3b8">
        Actor: <tspan fill="#a855f7">Dave (Revoked Member)</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="700">HTTP 200 OK (Secret Exposed)</tspan>
      </text>
    </g>

    <!-- Finding 4: Unauthenticated Access -->
    <g transform="translate(0, 265)" class="anim-find4">
      <text x="0" y="0">
        <tspan fill="#eab308" font-weight="700">[!] [HIGH]    </tspan>
        <tspan fill="#f8fafc" font-weight="600"> Broken Authentication / Leak </tspan>
        <tspan fill="#64748b">on</tspan>
        <tspan fill="#38bdf8"> GET /api/projects</tspan>
      </text>
      <text x="20" y="20" fill="#94a3b8">
        Actor: <tspan fill="#64748b">Anonymous User</tspan> ➔ Observed: <tspan fill="#ef4444" font-weight="700">HTTP 200 OK</tspan> (Expected: 401)
      </text>
    </g>

    <!-- Execution Summary Box -->
    <g transform="translate(0, 315)" class="anim-summary">
      <text x="0" y="0" fill="#6366f1">========================================================================</text>
      <text x="0" y="20">
        <tspan fill="#10b981" font-weight="700">[✓] Probes: 16/16 </tspan>
        <tspan fill="#64748b">│</tspan>
        <tspan fill="#ef4444" font-weight="700"> Findings: 10 </tspan>
        <tspan fill="#64748b">│</tspan>
        <tspan fill="#38bdf8" font-weight="700"> Precision: 100.0% </tspan>
        <tspan fill="#64748b">│</tspan>
        <tspan fill="#a855f7" font-weight="700"> Recall: 100.0%</tspan>
      </text>
      <text x="0" y="40" fill="#94a3b8">
        Reports: <tspan fill="#f8fafc">reports/report.html</tspan>, <tspan fill="#f8fafc">reports/report.md</tspan>, <tspan fill="#f8fafc">reports/report.json</tspan>
      </text>
      <text x="0" y="65">
        <tspan fill="#10b981" font-weight="700">researcher@stateweaver</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/project</tspan><tspan fill="#f8fafc">$ </tspan><tspan fill="#38bdf8" class="cursor">█</tspan>
      </text>
    </g>
  </g>
</svg>

