version: "1.0"
project_name: "acme-project-management"

scope:
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "::1"
  localhost_only: true
  allowed_ports:
    - 8080
    - 8081
    - 3000
    - 5000

execution:
  rate_limit_rps: 10
  request_budget: 150
  timeout_seconds: 5
  follow_redirects: false
  max_response_bytes: 2097152
  read_only: false
  stop_on_error: false
  max_retries: 2

paths:
  database_path: ".stateweaver/stateweaver.db"
  reports_dir: "reports"
  graphs_dir: "graphs"

redaction:
  sensitive_headers:
    - "authorization"
    - "cookie"
    - "set-cookie"
    - "x-api-key"
    - "x-auth-token"
  sensitive_keys:
    - "password"
    - "token"
    - "secret"
    - "api_key"
    - "access_token"
    - "refresh_token"
    - "session_id"
    - "credit_card"
  mask_value: "[REDACTED]"

policies_file: "policies.yaml"
identities_file: "identities.yaml"

