name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Differential Benchmark Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Code Formatting & Vetting
        run: |
          go fmt ./...
          go vet ./...

      - name: Build Binary
        run: go build -buildvcs=false -v ./...

      - name: Run Unit Tests
        run: go test -v -race ./internal/...

      - name: Run Differential Authorization Benchmark
        run: go test -v -race ./tests/...

